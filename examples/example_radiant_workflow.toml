# Recommended default: use `workflow = "radiant"` for the simplest Radiant + Fulcrum setup.
# This uses the workflow defaults, with the main search settings exposed directly below.
# Use the lower-level `v1`/`mbr` examples only when you need direct stage-level control.

workflow = "radiant"

library = "/data/library.tsv"
fasta = "/data/uniprot.fasta"
config = "/examples/example_radiant_config.radiantConfig"
mzml = ["…"]

# Default approach is library-free (single-pass).
mbr = false
fdr_thresh = 0.01
threads = 0
results_dir = "/data/results-radiant"

# Optional workflow customizations:
# [overrides.search]
# reuse_existing = true
#
# [overrides.output]
# location = "/data/fulcrum-results/"
# include_decoys = false
