# Use `workflow = "mbr"` for match-between-runs analysis.
# Choose this when you want a two-pass flow: build a confident library, then transfer IDs across runs.
# Prefer `workflow = "radiant"` with `mbr = true` unless you need direct low-level control of MBR stage parameters.

workflow = "mbr"

[library.search]
backend = "radiant"
location = ["…"]
library = "/data/library.tsv"
fasta = "/data/uniprot.fasta"
config = "/examples/example_radiant_config.radiantConfig"
output_location = "/data/radiant-firstpass-results/"
reuse_existing = false
scoring = "nn"
use_irt = true

[library.airpot]
backend = "none"

[library.cortado]
backend = "blocking_mixmax"
method = "mixmax"
pep_fdr_type = "precursor-only"
score_column = "ClassifierScore"
desc = true

[library.cortado.errprob_kwargs]
decoy_ratio = 1.0

[library.cortado.pi0_kwargs]
subset_size = 20000

[library.output]
backend = "write_library"
spectra_backend = "radiant"
location = "/data/fulcrum-mbr-library.tsv"
qval_thresh = 0.01
include_decoys = false
peptide_normalizer = false
use_irt = true
mode = "overwrite"

[search]
backend = "radiant"
location = ["…"]
fasta = "/data/uniprot.fasta"
config = "/examples/example_radiant_config.radiantConfig"
output_location = "/data/radiant-results/"
reuse_existing = false
scoring = "nn"
use_library_location = true
use_irt = true

[airpot]
backend = "none"

[cortado]
backend = "blocking_mixmax"
pep_fdr_type = "psm-only"
score_column = "ClassifierScore"
desc = true

[cortado.errprob_kwargs]
decoy_ratio = 1.0

[cortado.pi0_kwargs]
subset_size = 20000

[peptide_quant]
backend = "basic"
sample_column = "filename"
intensity_column = "TotalIntensityRaw"

[proffer]
fasta_uri = "/data/uniprot.fasta"
qvalue_threshold = 0.01
heuristic = "nsp"
reannotate = true

[protein_scoring]
rollup_level = "precursor"
assign_confidence = true

[protein_scoring.confidence_kwargs]
score_column = "nsp"
desc = false

[protein_rollup]
backend = "directlfq"
qvalue_threshold = 0.01

[output]
backend = "combined"
location = "/data/fulcrum-results/"
qval_thresh = 0.01
include_decoys = false
mode = "overwrite"
