name: Build and Push Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-x86_64:
    # Require that this step run on a self-hosted runner
    # within the aws-master AWS account; this will ensure
    # it has the necessary access to ECR.
    runs-on: [self-hosted, aws-master, X64]

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin 718843040700.dkr.ecr.us-west-2.amazonaws.com
      - name: Pull latest Pythia
        run: docker pull 718843040700.dkr.ecr.us-west-2.amazonaws.com/seer/pythia-dia:latest

      - name: Build and tag container image
        uses: seerbio/action-build-container@1.2.1
        with:
          container: seer/pythia-scry
          container_tag: x86_64-build-${{ github.run_number }}
          repository: 718843040700.dkr.ecr.us-west-2.amazonaws.com
          test_script: ./test-container.sh

  build-aarch64:
    # Require that this step run on a self-hosted runner
    # within the aws-master AWS account; this will ensure
    # it has the necessary access to ECR.
    runs-on: [self-hosted, aws-master, ARM64]

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin 718843040700.dkr.ecr.us-west-2.amazonaws.com
      - name: Pull latest Pythia
        run: docker pull 718843040700.dkr.ecr.us-west-2.amazonaws.com/seer/pythia-dia:latest

      - name: Build and tag container image
        uses: seerbio/action-build-container@1.2.1
        with:
          container: seer/pythia-scry
          container_tag: aarch64-build-${{ github.run_number }}
          repository: 718843040700.dkr.ecr.us-west-2.amazonaws.com
          test_script: ./test-container.sh
